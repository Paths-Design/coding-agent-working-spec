id: CLASSIFY-OWNER-IMPERSONATION-DENY-001
title: 'Owner-identity impersonation in an authorization field is denied'
risk_tier: 1
mode: fix
lifecycle_state: active
worktree: wt-impersonation
created_at: '2026-09-12T20:43:58.876Z'
updated_at: '2026-09-12T20:44:26.091Z'
