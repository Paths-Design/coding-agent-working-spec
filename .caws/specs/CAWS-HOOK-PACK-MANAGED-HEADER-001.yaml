invariants:
  - 'Every file declared `managed: true` in a hook-pack manifest carries the pack managed marker in its native header form — a comment block for shell/python, the root description string for JSON — so a fresh install produces files that a subsequent install or re-init recognises as its own.'
  - 'Adding headers is metadata-only: no guard semantics, runtime behavior, schema validation, or module docstring changes.'
  - 'The codex envelope platform claim is proven behaviorally (the installed codex dispatch writes platform=codex to .session-envelope.json), not only by grepping a template for a string.'
  - 'No test is repaired by weakening an assertion: the retargeted A5 assertions still fail if the envelope platform field disappears or the codex surface stops selecting its platform.'
acceptance:
  - id: A1
    given: 'the shared pack ships managed hook files, some with and some without the marker'
    when: 'the managed-header growth-doctrine guard runs'
    then: 'every template carrying CAWS-MANAGED-HOOK also carries edit_stance:, and no managed file is reported missing it'
  - id: A2
    given: 'a repository already initialized with one agent surface'
    when: 'caws init runs again for a different surface'
    then: 'init exits 0 and reports no unmarked file at a managed hook destination'
  - id: A3
    given: 'an unmodified tree installed from the shared pack'
    when: 'installHookPack(SHARED_PACK) runs a second time'
    then: 'every manifest destination reports action unchanged and its bytes are identical to the first install'
  - id: A4
    given: 'a codex-surface project with the shared pack installed'
    when: 'the installed codex PreToolUse dispatch handles a hook payload'
    then: 'the written .session-envelope.json carries platform "codex", not the claude-code fallback'
  - id: A5
    given: 'the durable-envelope writer was consolidated from the codex override into the shared session cache'
    when: 'the resolver divergence suite asserts the codex platform field'
    then: 'the assertions target the code that now owns the behavior and pass, while still failing if that behavior is removed'
non_functional:
  reliability:
    - 'A fresh install must leave the repository in a state that a repeat install or a second-surface init accepts, so install/init never refuses the files it just wrote.'
