invariants:
  - 'Trap state is the existing danger-latch sentinel file (danger-latch-<session>.json); no new authority surface is introduced, and the human reset script remains the only sanctioned clear path.'
  - 'While the trap is engaged, Bash admission is deny-by-default: only a fixed read-only allowlist of single simple commands (no separators, pipes, redirects, or command substitution) and the reset invocation itself are admitted; classifier "allow" no longer admits anything on its own.'
  - 'caws message send and caws message reply are refused with a dedicated enlist-help reason while trapped; a trapped session cannot delegate a blocked action to a peer.'
  - 'The first non-read-only attempt while trapped escalates: the session''s agent process receives SIGTERM. The kill fires only when the surface has escalation enabled (CAWS_TRAP_KILL=1, set per-surface by agent-surface.sh — server-shaped hosts where one process serves many sessions ship it off), the agent PID identity verifies (recorded pid + start-time + comm match the live process), and the target is not PID 1 and not the hook''s own process. Any verification failure or disabled surface degrades to block + loud log, never to an unverified kill.'
  - 'SessionStart reads quarantine state for the resolved session id and reports it as non-blocking additionalContext; it never kills and never blocks, so a restarted quarantined session converges to the same trap instead of a kill-restart loop.'
  - 'Every denial while trapped and every escalation decision is recorded (sentinel JSON strike fields + vendor danger-latch log line) with session id, command, and identity verdict.'
  - 'The reset fails closed: a reset that located zero vendor state dirs to search, or a machine-snapshot reset invoked without its env prefix, exits non-zero with the corrected command instead of reporting success-by-absence.'
acceptance:
  - id: A1
    given: 'a session with an armed trap sentinel'
    when: 'it runs a single simple read-only command (ls, cat <file>, git status, git log --oneline)'
    then: 'the guard exits 0 and admits the command with no block decision emitted'
  - id: A2
    given: 'a session with an armed trap sentinel'
    when: 'it runs a previously classifier-allowed mutating command (git commit -m x, caws worktree merge wt-x, rm <sentinel>, echo x > <sentinel>)'
    then: 'the guard emits a block decision whose reason names the trap (not the original trigger) and the command does not run'
  - id: A3
    given: 'a session with an armed trap sentinel'
    when: 'it runs a compound, piped, redirected, or command-substituted shape whose head is read-only (ls; rm x, cat $(rm x), echo x > f, cat f | sh)'
    then: 'the guard emits a block decision (the allowlist admits single simple commands only)'
  - id: A4
    given: 'a session with an armed trap sentinel'
    when: 'it runs caws message send or caws message reply with any arguments'
    then: 'the guard emits a block decision whose reason names the enlist-help refusal specifically'
  - id: A5
    given: 'a session with an armed trap sentinel'
    when: 'it runs a read-only caws verb (caws status, caws specs list)'
    then: 'the guard exits 0 and admits the command'
  - id: A6
    given: 'a session with an armed trap sentinel'
    when: 'it runs the reset-danger-latch.sh invocation for its own session'
    then: 'the guard exits 0 (the reset exemption is preserved)'
  - id: A7
    given: 'a session with an armed trap sentinel and a planted agent-pid record that identity-matches a live substitute agent process'
    when: 'it runs any non-read-only command'
    then: 'the guard records a strike, emits the block decision first, then sends SIGTERM to the verified agent pid, and the escalation (pid, signal, reason) is logged to the vendor danger-latch log'
  - id: A8
    given: 'a session with an armed trap sentinel whose recorded agent pid is dead, recycled (start-time mismatch), PID 1, drifted from the live resolution, or whose surface ships kill escalation disabled (shared-process host)'
    when: 'it runs any non-read-only command'
    then: 'the guard blocks and logs the identity/enablement verdict WITHOUT sending any signal'
  - id: A9
    given: 'a session id with an existing trap sentinel starts a new harness session'
    when: 'the SessionStart agent-register hook runs'
    then: 'additionalContext reports the quarantine (read-only-only admission, escalation-on-attempt, human reset command) and the hook still exits 0; with no sentinel the hook emits nothing extra'
  - id: A10
    given: 'the machine-runtime reset script invoked without CAWS_MACHINE_RUNTIME/CAWS_PROJECT_DIR env, or any invocation that locates zero vendor state dirs'
    when: 'it tries to clear a latch'
    then: 'it exits non-zero, prints the corrected env-prefixed re-run command, and clears nothing'
  - id: A11
    given: 'a session with an armed trap sentinel and a git alias that shadows an allowlisted read-only subcommand (alias.status=!rm -rf)'
    when: 'it runs the shadowed subcommand (git status)'
    then: 'the guard emits a block decision (alias-shadowed subcommands are not read-only)'
observability:
  - 'Every trap denial and escalation appends a typed record to the sentinel JSON and the vendor danger-latch log: session id, command, strike count, agent pid identity verdict, kill decision and reason.'
rollback:
  - 'Revert the implementation commit; the sentinel format is backward-compatible (old files lack strike/pid fields and reset to plain latch semantics); rerun the block-dangerous and reset-danger-latch bats suites plus caws doctor.'
non_functional:
  security:
    - 'Kill escalation fires only on an identity-verified agent PID (pid + start-time + comm match, PID 1 and self excluded, shared-PID refused); no secrets are logged; the read-only allowlist admits single simple commands only.'
  reliability:
    - 'Trap admission fails closed: any error in the read-only predicate or identity resolution denies rather than admits; the SessionStart quarantine read fails open (advisory only) and can never block a session start.'
