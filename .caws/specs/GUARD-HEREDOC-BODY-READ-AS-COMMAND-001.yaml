invariants:
  - 'A heredoc BODY is payload, not command text. bash-write-guard.sh tokenizes the command string to find mutation targets; a body containing a redirect/tee/rm verb was therefore read as a command and routed to the worktree-claim oracle, producing a false ownership block on a command that mutated only the file it actually redirected into.'
  - 'The classifier path is already correct and must not be changed. classify_command.py carries an in_heredoc state machine (lines 882-929, 2241-2275) that never treats a body as command text, so the danger-latch decision is already heredoc-safe; this slice touches only the shell target extractor.'
  - 'Neutralization is a SAFELIST, never a blanket blanking. A heredoc fed to an interpreter IS code — a body containing "git push --force" fed to bash must still be recognized — so a body is blanked only when the introducing line command provably writes its payload out (cat, tee, extensible via CAWS_HEREDOC_FILE_SINKS). Every other command keeps its body fully visible and is adjudicated exactly as before. The residue of this design is a false POSITIVE (an unrecognized file sink still has its body scanned), never a hole.'
  - 'Blanked bodies preserve line count and delimiter lines, so any position a caller reports still points at the right line.'
  - 'Recognition grants no permission: the heredoc helper is pure text transformation, reads no session state, decides no ownership, writes nothing, and exits nothing.'
acceptance:
  - id: A1
    given: 'a Bash command whose heredoc body (introduced by cat or tee) contains a redirect to a path claimed by a foreign worktree'
    when: 'bash-write-guard.sh adjudicates it'
    then: 'the body text is NOT treated as a write target: the guard does not report the foreign claim'
  - id: A2
    given: 'a heredoc body fed to an interpreter (a bash heredoc whose body contains a force-push command)'
    when: 'the same neutralization is applied'
    then: 'the body stays fully visible, so the dangerous content is still adjudicated — the safelist is not a bypass'
  - id: A3
    given: 'a heredoc body that is genuinely irrelevant to the outer command'
    when: 'the outer command is wrapped in a compound with a sibling mutation before the heredoc'
    then: 'the sibling mutation is still adjudicated normally — a body may not be used to hide a sibling mutation'
  - id: A4
    given: 'input with no heredoc, or a heredoc whose delimiter never closes'
    when: 'the helper runs'
    then: 'the no-heredoc input is returned byte-identically, and an unterminated body is blanked to end-of-input without error or hang'
  - id: A5
    given: 'a heredoc body carrying a line that begins with the delimiter but is not equal to it'
    when: 'the helper runs'
    then: 'the body continues — only an exact delimiter line closes the heredoc'
observability:
  - 'The helper is invoked immediately before target extraction in bash-write-guard.sh, so the guard''s own advisory output already shows whether a target was recognized; a body-only false positive disappears from that output.'
rollback:
  - 'Revert the implementation commit and remove lib/heredoc.sh from the pack manifest; the guard returns to reading bodies as command text. Rerun the bash-write-guard bats suites and caws doctor.'
non_functional:
  security:
    - 'The safelist direction is fail-closed: an unrecognized command, an unparseable form, or an interpreter keeps its body visible, so neutralization can only ever hide payload text that the introducing command provably only writes out. Widening CAWS_HEREDOC_FILE_SINKS is the single knob, and it is safe only for a command that cannot execute its payload.'
  reliability:
    - 'Pure text transformation over the command string already held in memory: no process spawn, no filesystem read, no network. A missing lib leaves the guard behaving exactly as it does today (unchanged behavior, not a bypass), and an unterminated heredoc cannot hang.'
