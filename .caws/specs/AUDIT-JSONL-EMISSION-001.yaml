invariants:
  - 'Every audit record is exactly one line: jq emits compact JSON (-c), so a line-wise consumer can parse the log without a streaming parser and no record can bleed into the next.'
  - 'A tool_use record carries the tool payload: tool_use_id, tool_input, tool_response, and a derived is_error boolean (true when the response reports a nonzero exit_code, false when it is zero or absent).'
  - 'The change is emission-only: the same event shapes and fields that existed before are preserved (session_start, session_stop, tool_use, and the unknown-event fallback), so existing consumers keep working and gain the payload fields.'
  - 'Both sinks stay identical: audit.log and the dated audit-<date>.log receive the same compact line.'
acceptance:
  - id: A1
    given: 'the audit hook runs for a tool-use event'
    when: 'the audit log is read back'
    then: 'every line parses as exactly one JSON object (jq -e per line succeeds) in both the rolling and dated log files'
  - id: A2
    given: 'a tool-use event whose payload includes tool_use_id, tool_input, and tool_response'
    when: 'the audit record is inspected'
    then: 'tool_use_id, tool_input, and tool_response are present and equal to the payload values'
  - id: A3
    given: 'a tool-use event whose tool_response has a nonzero exit_code'
    when: 'the audit record is inspected'
    then: 'is_error is true; when exit_code is zero or absent, is_error is false'
  - id: A4
    given: 'session-start, stop, and unknown-event audits'
    when: 'their records are read back'
    then: 'each is a single-line JSON object (no pretty-print leakage in any branch)'
observability:
  - 'Each audit record is one compact JSON object per line in both audit.log and the dated file, with tool_use_id/tool_input/tool_response/is_error present on tool_use records.'
rollback:
  - 'Revert the implementation commit; the pretty-printed multi-line emission returns; rerun the audit bats suite plus caws doctor.'
non_functional:
  security:
    - 'No secret material is added: the record carries the same tool input/response fields already persisted by the audit hook''s consumers, in a line-delimited form; is_error is derived from the response exit code only.'
  reliability:
    - 'Emission stays pure shell + jq with no new dependencies; the compact form is produced by the same jq invocation, so a jq failure behaves exactly as before (the hook exits non-zero rather than writing a malformed record).'
