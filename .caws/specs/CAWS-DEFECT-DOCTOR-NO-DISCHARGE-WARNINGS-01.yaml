invariants:
  - 'Recorded in sterling/tmp/caws_cli_defects.md (Defect 1 + Minor): doctor.worktree.event_without_control_plane_binding fires as a warning for worktree_created events whose control-plane lifetime can never be closed through any governed command (destroy/prune/repair refuse the class by design; hand-forging chain events is tampering). A warning that demands a remedy nobody can perform trains operators to ignore doctor. The honest intended state for a name that is observably dead EVERYWHERE is an informational tombstone, not a warning.'
  - 'Doctor stays pure: the downgrade is decided ONLY from caller-provided observations — the local branch-ref list, the created-event recorded-path existence map, and the linked-worktree listing. The kernel performs no I/O and mutates nothing (the existing A5 frozen-input contract holds).'
  - 'Unobserved is not absent: when any required observation is undefined, or the path map lacks the name, or the worktree listing is unavailable, the finding KEEPS warning severity (the §2f degrade-elsewhere pattern). The downgrade is conjunctive over every physical residue signal: registry entry absent, spec binding absent, destroy event absent (the finding preconditions), recorded branch absent from local refs, recorded path absent on disk, and no linked worktree at the recorded path. Any residue present or any observation missing → warning.'
  - 'The audit chain is never mutated by this slice: no new event type, no reconcile command, no change to the destroy/prune/repair refusal matrix. The created-event stays immutable history; both severities of the finding name no mutating command in their repair text (diagnose-only posture preserved).'
  - 'Global home: an entry that is RECOGNIZED legacy output of a prior CLI generation (sessions/ — pre-v11 machine-home session logs; current session logs are repo-local .caws/sessions/) is not "unmanaged state requiring review" and must not warn. It renders as a distinct informational finding naming its legacy provenance. Truly unknown entries still warn with the existing rule. If a future CLI generation writes ~/.caws/sessions again, it belongs in the managed set, not the legacy set.'
  - 'No behavior change for any live worktree name: every discharge condition (registry entry, spec binding, destroy event) is false only for orphans, and live names never reach the severity decision.'
acceptance:
  - id: A1
    given: 'a worktree_created orphan (no registry entry, no spec binding, no destroy event) whose recorded branch is absent from the observed local branch refs, whose recorded path is observed absent, and whose recorded path hosts no linked worktree'
    when: 'inspectProjectState runs with localBranchRefs, filesystem.createdWorktreePathExistsByName, and gitWorktrees all provided'
    then: 'doctor.worktree.event_without_control_plane_binding is reported at severity info as a verified-dead tombstone, with data.verified_dead === true and the recorded branch/path named in the finding data'
  - id: A2
    given: 'the same orphan shape but the recorded branch IS present in the observed local branch refs'
    when: 'inspectProjectState runs'
    then: 'the finding stays at severity warning (physical residue remains — the branch is recoverable history) and carries no verified_dead data'
  - id: A3
    given: 'the same orphan shape but the recorded path exists on disk, OR a linked worktree is listed at the recorded path'
    when: 'inspectProjectState runs'
    then: 'the finding stays at severity warning'
  - id: A4
    given: 'the same orphan shape but any observation is missing (no localBranchRefs, no createdWorktreePathExistsByName entry for the name, or no gitWorktrees)'
    when: 'inspectProjectState runs'
    then: 'the finding stays at severity warning — unobserved never downgrades'
  - id: A5
    given: 'a present global home whose entries are exactly [state, sessions, mystery-dir]'
    when: 'inspectProjectState runs'
    then: 'doctor.global_home.unmanaged_state warns naming only mystery-dir, and a new info-severity recognized-legacy finding names sessions as legacy session-log output of a prior CLI generation'
  - id: A6
    given: 'a present global home whose entries are exactly [state, sessions]'
    when: 'inspectProjectState runs'
    then: 'no unmanaged_state warning fires; the recognized-legacy info finding still names sessions'
  - id: A7
    given: 'any input, including a deep-frozen snapshot carrying the new observations'
    when: 'inspectProjectState runs'
    then: 'it performs no I/O and mutates nothing (frozen-input contract extends to the new fields)'
  - id: A8
    given: 'a fixture repository whose event log chains a worktree_created for a name with no registry entry, whose branch was deleted, and whose recorded path does not exist'
    when: 'composeStoreSnapshot runs over that repository'
    then: 'the snapshot carries localBranchRefs without the branch, createdWorktreePathExistsByName[name] === false, and gitWorktrees without the recorded path — the exact inputs A1 requires'
non_functional:
  reliability:
    - 'Every new observation is individually optional and non-fatal: a git for-each-ref failure, an unreadable path, or an absent events log degrades to the status-quo warning, never to a doctor crash or a false downgrade.'
  security:
    - 'Read-only observability change: no new write path, no authority change, no event mutation. The downgrade cannot be triggered by tampering with the chain (the created-event and its hash are already integrity-checked upstream).'
