id: CAWS-HOOK-ADVISORY-SESSION-DEDUP-01
title: 'The hook composer re-injects an identical advisory every time its handler fires, and each duplicate costs context'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: wt-advisory-dedup
created_at: '2026-09-11T01:30:00.000Z'
updated_at: '2026-09-11T03:00:55.360Z'
blast_radius:
  modules:
    - 'caws-cli shared hook pack (handler dispatch loop, advisory composition)'
    - 'caws-cli codex hook pack (per-surface dispatch override)'
    - 'caws-cli kimi-code hook pack (per-surface dispatch override)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/lib/run-handlers.sh'
    - 'packages/caws-cli/templates/hook-packs/codex/hooks/lib/run-handlers.sh'
    - 'packages/caws-cli/templates/hook-packs/kimi-code/hooks/lib/run-handlers.sh'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/src/init/hook-packs/manifest-codex.ts'
    - 'packages/caws-cli/src/init/hook-packs/manifest-kimi-code.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/tests/hooks/bats/run-handlers-advisory-dedup.bats'
    - 'docs/architecture/design/hook-io-contract-v1.md'
    - packages/caws-cli/tests/adapter/machine-runtime.test.js
  out:
    - 'packages/caws-cli/src/kernel'
invariants:
  - 'Suppression is keyed on the exact advisory text, so any content change re-surfaces the advisory. Dedup can never hide advice that differs from what the session already received.'
  - 'Control decisions are never suppressed. A block/deny short-circuits before dedup is consulted.'
  - 'The ledger is per-session and per-machine; one session or project never suppresses another session''s advisory.'
  - 'A missing, unreadable, unwritable, or oversized ledger fails open: the advisory is emitted rather than suppressed.'
  - 'Every suppression is reported on stderr, so a reader can tell "this guard did not fire" from "this guard fired and was deduplicated".'
  - 'The ledger is bounded: it cannot grow without limit across a long session.'
acceptance:
  - id: A1
    given: 'a handler that emits byte-identical advisory text on two separate invocations in the same session'
    when: 'the dispatcher composes the second invocation'
    then: 'the text is suppressed and the suppression is reported on stderr, so the duplicate does not reach the model a second time'
  - id: A2
    given: 'a handler whose advisory text differs from the text already recorded for it in this session'
    when: 'the dispatcher composes it'
    then: 'the advisory is emitted, because a changed fact must re-surface'
  - id: A3
    given: 'a handler returning a hard control decision after an identical decision was already returned in this session'
    when: 'the dispatcher composes the invocation'
    then: 'the decision is forwarded and short-circuits exactly as before, unaffected by dedup'
  - id: A4
    given: 'an absent, unreadable, or unwritable session ledger'
    when: 'the dispatcher composes an advisory'
    then: 'the advisory is emitted, so ledger trouble degrades to the previous behaviour rather than silencing a guard'
  - id: A5
    given: 'a session ledger whose recorded keys exceed the configured bound'
    when: 'a new key is appended'
    then: 'the ledger is truncated to a bounded size while the most recent keys are retained, so a long session cannot grow the file without limit'
contracts:
  - name: Advisory session dedup contract
    type: behavior
    path: 'packages/caws-cli/templates/hook-packs/shared/lib/run-handlers.sh'
    description: 'Per-session, text-keyed suppression of repeated advisory cards with an audited skip line, bounded ledger, and fail-open behavior on any ledger fault.'
non_functional:
  reliability:
    - 'Dedup must not add an unbounded read or write per dispatch: one ledger read per dispatch and at most one append.'
    - 'A ledger fault must never block a tool call or change a control decision.'
