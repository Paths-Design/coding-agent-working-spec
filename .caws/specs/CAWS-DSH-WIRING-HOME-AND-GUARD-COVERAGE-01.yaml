invariants:
  - 'COMPOSITION TRUTH: the description states the profile composition order the runtime documents — each bundle in dsh.profile.bundles contributes its own patch (declared as dsh.bundle.patch in that bundle''s package.json), THEN the profile''s own cordis.patch.yml, then --patch overlays. The profile patch is an additional layer, not the source of the CAWS plugin ids.'
  - 'NO RETRACTED RULE: no shipped artifact claims that the profile''s cordis.patch.yml inserts the CAWS plugin ids; the derivation names the bundle patch layer and tells the reader to confirm the composed tree rather than infer it.'
  - 'GUARD COVERAGE LOCKSTEP: every implemented agent surface has a recorded pack-fingerprint baseline, and a lockstep assertion fails loudly when a surface is added or dropped without one, so the omission class cannot recur silently.'
  - 'NO BEHAVIOR CHANGE: guard logic, dispatcher paths, the surface registry, and the installed-file manifest are untouched. Only the runtime description, its guidance text, and the test-side fingerprint baseline change.'
  - 'BASELINE IS DERIVED: the recorded dsh fingerprint is computed from the live template tree, never copied, and carries the manifest version so a doctrine edit without a bump fails.'
acceptance:
  - id: A1
    given: 'the shipped dsh doctrine, manifest summary, and rendered install guidance'
    when: 'each is inspected for the wiring-home derivation'
    then: 'each names the profile bundle list and the per-bundle patch layer (dsh.bundle.patch), and none asserts that the profile''s own cordis.patch.yml is what inserts the CAWS plugin ids'
  - id: A2
    given: 'the A8 assertion helpers'
    when: 'they run against the shipped artifacts and against a control text carrying the retracted rule'
    then: 'the shipped artifacts pass and the control fails, so the corrected rule is enforced rather than merely present'
  - id: A3
    given: 'the fingerprint guard and its recorded baseline'
    when: 'it runs for the dsh pack'
    then: 'the live dsh template fingerprint equals the recorded baseline and the recorded version equals DSH_PACK_VERSION'
  - id: A4
    given: 'the implemented-surface registry projection'
    when: 'the fingerprint guard''s covered-pack set is compared against it'
    then: 'every implemented surface is covered, and removing a surface from the covered set fails an explicit lockstep assertion'
