id: CLAIM-ORACLE-DIRECTORY-CONTAINMENT-001
title: 'Scope-glob directory containment: a directory entry claims (and excludes) its whole subtree'
risk_tier: 1
mode: fix
lifecycle_state: active
worktree: wt-oracle-contain
created_at: '2026-09-12T20:35:00.352Z'
updated_at: '2026-09-12T20:35:26.886Z'
created_by_session: 'session-c04418cd-a035-44a9-b26e-378d285ccad1'
blast_radius:
  modules:
    - 'packages/caws-cli/templates/hook-packs/shared/lib/worktree-claim-oracle.cjs (globToRegExp)'
    - 'packages/caws-cli/templates/hook-packs/shared/lib/caws-state.sh (CAWS_NODE_GLOB_TO_SCOPE_REGEXP, consumed by scope-guard.sh)'
    - 'packages/caws-cli/tests/hooks/pytest/test_worktree_claim_oracle.py'
    - 'packages/caws-cli/tests/hooks/bats/scope-guard.bats'
  data_migration: false
scope:
  in:
    - packages/caws-cli/templates/hook-packs/shared/lib/worktree-claim-oracle.cjs
    - packages/caws-cli/templates/hook-packs/shared/lib/caws-state.sh
    - packages/caws-cli/tests/hooks/pytest/test_worktree_claim_oracle.py
    - packages/caws-cli/tests/hooks/bats/scope-guard.bats
  out:
    - packages/caws-cli/src
    - packages/caws-cli/dist
invariants:
  - 'A scope entry denotes a path AND everything beneath it: after wildcard expansion the pattern is anchored with a containment suffix requiring a "/" boundary, so "pkg/dir" matches "pkg/dir" and "pkg/dir/x" but never "pkg/directory".'
  - 'Trailing slashes are stripped before compilation so "dir/" and "dir" agree; an entry that is empty after stripping compiles to a never-matching regex rather than claiming or excluding everything.'
  - 'BOTH matcher copies carry identical semantics: worktree-claim-oracle.cjs and the shell-embedded CAWS_NODE_GLOB_TO_SCOPE_REGEXP string in caws-state.sh (consumed by scope-guard.sh) must answer identically for the same (path, pattern) pair.'
  - 'The bug had two faces, both closed: the claim oracle under-claimed (a file beneath an actively-claimed directory returned pass:unclaimed, so foreign writes were admitted), while scope-guard over-refused directory-shaped scope.in entries (only the literal directory string matched).'
  - 'Wildcard semantics are unchanged: ** crosses segments, * stays within a segment, ? matches one character, metacharacters stay escaped.'
acceptance:
  - id: A1
    given: 'a worktree bound to a spec whose scope.in contains a directory entry (with or without a trailing slash)'
    when: 'another session mutates a file beneath that directory'
    then: 'the oracle returns block_claimed (the file is claimed), where the pre-fix oracle returned pass:unclaimed'
  - id: A2
    given: 'a directory-shaped scope entry "pkg/dir"'
    when: 'the matcher is asked about a sibling whose name merely shares the prefix ("pkg/directory/file")'
    then: 'it does not match (the containment suffix requires a "/" boundary)'
  - id: A3
    given: 'a scope entry that is empty or only slashes'
    when: 'the matcher compiles it'
    then: 'it matches nothing (no claim and no exclusion is derived from an empty pattern)'
  - id: A4
    given: 'the two matcher copies (oracle .cjs and the caws-state.sh embedded string)'
    when: 'both are asked about the same directory, boundary, wildcard, and empty-pattern cases'
    then: 'they return identical results (parity asserted in the scope-guard bats suite)'
observability:
  - 'Both matcher copies (worktree-claim-oracle.cjs and the shell-embedded CAWS_NODE_GLOB_TO_SCOPE_REGEXP in caws-state.sh) carry the same containment semantics; the parity test asserts they agree on directory and boundary cases.'
rollback:
  - 'Revert the implementation commit; directory-shaped entries return to exact-string matching; rerun the oracle pytest suite, the scope-guard bats suite, and caws doctor.'
non_functional:
  security:
    - 'Containment closes silent under-enforcement: a file beneath an actively-claimed directory is claimed again, so foreign writes block. The empty pattern compiles to a never-matching regex rather than claiming everything, and the "/" boundary keeps "pkg/dir" from matching "pkg/directory".'
  reliability:
    - 'Compilation stays pure and dependency-free in both copies; no new inputs or side effects are introduced, so existing wildcard, escaping, and file-shaped entry behavior is preserved.'
contracts:
  - name: 'scope-glob-containment'
    type: 'contract-test'
    path: 'packages/caws-cli/tests/hooks/pytest/test_worktree_claim_oracle.py'
    description: 'Oracle claims files beneath directory-shaped scope.in entries (with and without trailing slash), respects the / boundary, never claims from an empty pattern; the scope-guard bats suite asserts the shell-embedded copy agrees.'
