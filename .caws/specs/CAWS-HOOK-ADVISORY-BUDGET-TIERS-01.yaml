id: CAWS-HOOK-ADVISORY-BUDGET-TIERS-01
title: 'The hook advisory composer admits cards against one cumulative budget, so an oversized card silently starves every later handler'''
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-09-10T23:30:00.000Z'
updated_at: '2026-09-10T23:30:00.000Z'
blast_radius:
  modules:
    - 'caws-cli shared hook pack (handler dispatch loop, advisory composition)'
    - 'caws-cli codex hook pack (per-surface dispatch override)'
    - 'caws-cli kimi-code hook pack (per-surface dispatch override)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/lib/run-handlers.sh'
    - 'packages/caws-cli/templates/hook-packs/codex/hooks/lib/run-handlers.sh'
    - 'packages/caws-cli/templates/hook-packs/kimi-code/hooks/lib/run-handlers.sh'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/src/init/hook-packs/manifest-codex.ts'
    - 'packages/caws-cli/src/init/hook-packs/manifest-kimi-code.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/tests/hooks/bats/run-handlers-advisory-budget.bats'
    - 'docs/architecture/design/hook-io-contract-v1.md'
  out:
    - 'packages/caws-cli/src/kernel'
invariants:
  - 'Admitted advisory text plus its truncation marker never exceeds the configured budget.'
  - 'A card that does not fit is either truncated with an explicit marker naming the elided byte count, or omitted with a diagnostic naming its own size. It is never silently dropped.'
  - 'Control decisions (block/deny/ask) are never truncated and never composed away.'
  - 'Suppressing, truncating, or omitting advisory text never grants denial authority.'
  - 'Composition order is handler order; a later card never displaces an earlier admitted card.'
acceptance:
  - id: A1
    given: 'two advisory cards whose combined size exceeds the budget while the first alone fits'
    when: 'the dispatcher composes them'
    then: 'the first is admitted whole and the second is truncated to the remaining budget with an explicit elided-byte marker, instead of being dropped whole'
  - id: A2
    given: 'a card larger than the entire budget'
    when: 'the dispatcher composes it'
    then: 'the admitted text stays within the budget and carries a marker that identifies the card as truncated'
  - id: A3
    given: 'a handler whose advisory output cannot fit and will not be truncated'
    when: 'the dispatcher omits it'
    then: 'the diagnostic reports that card own size against the budget, never the running cumulative total'
  - id: A4
    given: 'a handler returning a hard control decision'
    when: 'the dispatcher composes the invocation'
    then: 'the decision is forwarded verbatim with no truncation and short-circuits as before'
  - id: A5
    given: 'a budget too small to hold any advisory text'
    when: 'the dispatcher composes an advisory'
    then: 'it declines to admit partial content and reports the omission rather than emitting a marker-only or over-budget string'
contracts:
  - name: Advisory composition budget contract
    type: behavior
    path: 'packages/caws-cli/templates/hook-packs/shared/lib/run-handlers.sh'
    description: 'Per-card admission under one byte budget with explicit, self-describing truncation or omission; control decisions bypass composition.'
non_functional:
  reliability:
    - 'Advisory composition must remain bounded regardless of how many handlers emit cards or how large each card is.'
    - 'An omitted or truncated advisory must be observable on stderr, never silent.'
