id: HOOKPACK-STALENESS-VISIBILITY-001
title: 'SessionStart surfaces pack drift: installed stock handlers that differ from the pinned runtime'
risk_tier: 2
mode: feature
lifecycle_state: active
worktree: wt-staleness
created_at: '2026-09-12T21:05:29.273Z'
updated_at: '2026-09-12T21:05:54.402Z'
created_by_session: 'session-c04418cd-a035-44a9-b26e-378d285ccad1'
blast_radius:
  modules:
    - 'packages/caws-cli/templates/hook-packs/shared/agent-register.sh (SessionStart advisory)'
    - 'packages/caws-cli/tests/hooks/bats/agent-register-quarantine.bats'
  data_migration: false
scope:
  in:
    - packages/caws-cli/templates/hook-packs/shared/agent-register.sh
    - packages/caws-cli/tests/hooks/bats/agent-register-quarantine.bats
  out:
    - packages/caws-cli/src
    - packages/caws-cli/dist
invariants:
  - 'A project-local stock handler shadows the machine snapshot, so a runtime fix never reaches a repo carrying its own copy until someone ports it — silently. SessionStart compares the installed stock files against the pinned runtime manifest and reports the differing ones.'
  - 'The advisory distinguishes "differs" from "stale": a customized project file is legitimate and is REPORTED, never overwritten, reverted, or refused; the message routes to the review surface (caws init --plan / init diff) and the sanctioned port (caws init port).'
  - 'Read-only and fail-open: the check reads the runtime pointer, the runtime manifest and the installed files, emits at most one bounded context line, and emits nothing (never blocks) when the pointer, manifest, node, or any file is unavailable.'
  - 'Bounded output: at most five file names are named, with a count for the remainder, so a large drift cannot bloat session context.'
  - 'Disableable: CAWS_PACK_STALENESS_CHECK=0 silences the advisory without touching the pack.'
acceptance:
  - id: A1
    given: 'a project whose installed stock file differs from the pinned runtime manifest entry'
    when: 'the SessionStart agent-register hook runs'
    then: 'additionalContext reports pack drift with the differing file named, and the hook still exits 0'
  - id: A2
    given: 'a project whose installed stock files all match the pinned runtime manifest'
    when: 'the SessionStart hook runs'
    then: 'no pack-drift context is emitted'
  - id: A3
    given: 'no readable runtime pointer or manifest in the machine home'
    when: 'the SessionStart hook runs'
    then: 'no pack-drift context is emitted and the hook exits 0 (fail-open)'
  - id: A4
    given: 'CAWS_PACK_STALENESS_CHECK=0 with a differing installed file'
    when: 'the SessionStart hook runs'
    then: 'no pack-drift context is emitted'
observability:
  - 'The advisory names the count and the first few differing stock files and routes to the existing review surfaces (caws init --plan / init diff) and the sanctioned port (caws init port).'
rollback:
  - 'Revert the implementation commit; SessionStart stops reporting pack drift; rerun the agent-register bats suite plus caws doctor.'
non_functional:
  security:
    - 'Read-only advisory: the hook only reads the runtime pointer, manifest and installed files, emits a bounded context line, and fails open (missing pointer/manifest/jq/node or unreadable files emit nothing and never block). Customized project files are REPORTED as differing, never overwritten or reverted.'
  reliability:
    - 'One node process per SessionStart hashing the manifest entries (roughly forty files); any read or parse failure exits the helper silently, so the advisory can never wedge a session start.'
contracts:
  - name: 'pack-staleness-advisory'
    type: 'contract-test'
    path: 'packages/caws-cli/tests/hooks/bats/agent-register-quarantine.bats'
    description: 'Differing installed file -> advisory names it; all matching -> silent; missing pointer/manifest -> silent fail-open; CAWS_PACK_STALENESS_CHECK=0 -> silent.'
evidence:
  - criterion_id: A1
    status: pass
    evidence_ref: "bats agent-register-quarantine.bats 'pack drift: an installed stock file differing from the pinned runtime is named (A1)' — red before the implementation, green after; falsified by an admit-all mutation (comparison replaced with always-push) which turned A1's sibling A2 red"
    recorded_at: "2026-09-12T21:20:53.434Z"
  - criterion_id: A2
    status: pass
    evidence_ref: "bats agent-register-quarantine.bats 'pack drift: no advisory when every installed stock file matches the runtime (A2)' — fixture publishes every entry with its real sha256; red under the admit-all mutation"
    recorded_at: "2026-09-12T21:20:55.344Z"
  - criterion_id: A3
    status: pass
    evidence_ref: "bats agent-register-quarantine.bats 'pack drift: no advisory and exit 0 with no readable runtime pointer (A3)' — red under a fire-on-missing-pointer mutation"
    recorded_at: "2026-09-12T21:20:57.146Z"
  - criterion_id: A4
    status: pass
    evidence_ref: "bats agent-register-quarantine.bats 'pack drift: CAWS_PACK_STALENESS_CHECK=0 silences a real drift (A4)' — red under a mutation that ignored the disable gate"
    recorded_at: "2026-09-12T21:20:58.982Z"