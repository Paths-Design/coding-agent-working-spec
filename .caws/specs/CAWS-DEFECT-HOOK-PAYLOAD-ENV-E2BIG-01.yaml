id: CAWS-DEFECT-HOOK-PAYLOAD-ENV-E2BIG-01
title: 'The hook dispatcher exports the whole tool payload into the process environment, so a large tool response fails every handler with E2BIG'
risk_tier: 2
mode: fix
lifecycle_state: active
created_at: '2026-09-10T22:30:00.000Z'
updated_at: '2026-09-10T22:30:00.000Z'
blast_radius:
  modules:
    - 'caws-cli shared hook pack (input parser, payload transport)'
    - 'caws-cli codex hook pack (per-surface input parser override)'
    - 'caws-cli machine adapter runtime (dispatch consumes the parser)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - 'packages/caws-cli/templates/hook-packs/shared/lib/parse-input.sh'
    - 'packages/caws-cli/templates/hook-packs/codex/hooks/lib/parse-input.sh'
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts'
    - 'packages/caws-cli/src/init/hook-packs/manifest-codex.ts'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json'
    - 'packages/caws-cli/tests/hooks/bats/parse-input.bats'
    - 'packages/caws-cli/tests/hooks/bats/parse-input-payload-transport.bats'
  out:
    - 'packages/caws-cli/src/kernel'
invariants:
  - 'No tool-call payload byte reaches the process environment without a size bound; environment size is independent of payload size.'
  - 'A payload is never silently truncated. Any consumer that cannot see the full bytes is told so by an explicit marker and can read them from the payload file.'
  - 'Payload transport failure fails open. A missing or unreadable payload file degrades to scalar-only extraction and never blocks a tool call.'
  - 'Guard control decisions (allow/deny/ask) are unaffected by transport mode; transport changes how bytes move, never whether a guard fires.'
acceptance:
  - id: A1
    given: 'a tool response large enough that the serialized hook payload exceeds the argument-list limit, such as a multi-megabyte image response'
    when: 'the dispatcher parses the hook input and runs a handler'
    then: 'the handler completes without Argument list too long, because the payload no longer enters the environment'
  - id: A2
    given: 'a payload transported by file rather than inline'
    when: 'a consumer reads the payload file and decodes it'
    then: 'it recovers the full original payload byte-for-byte, so no tool input or response content is lost by moving it off the environment'
  - id: A3
    given: 'a payload below the inline threshold'
    when: 'the dispatcher parses the hook input'
    then: 'the inline HOOK_* variables remain populated exactly as before and no payload file is exported, so existing handlers and project extensions are unaffected'
  - id: A4
    given: 'a payload above the inline threshold'
    when: 'a handler that cannot read the payload file inspects the inline variables'
    then: 'it sees an explicit truncation marker rather than a partial value presented as complete, so absence of bytes is distinguishable from empty content'
  - id: A5
    given: 'a dispatch whose payload file cannot be created or read'
    when: 'the parser runs'
    then: 'extraction falls back to scalar fields and the hook still runs, so an infrastructure failure never becomes a blocked tool call'
contracts:
  - name: Hook payload transport contract
    type: behavior
    path: 'packages/caws-cli/templates/hook-packs/shared/lib/parse-input.sh'
    description: 'Bounded inline environment plus an opt-in full-fidelity payload file; truncation is always explicitly marked and transport failure fails open.'
non_functional:
  reliability:
    - 'A payload of arbitrary size must not make any handler invocation fail to exec.'
    - 'The payload file is dispatch-scoped and removed when the dispatch exits, including on failure.'
