id: HOOKPACK-SHARED-VERSION-STAMP-INTEGRITY-001
title: 'shared pack template changes land without a SHARED_PACK_VERSION bump, disabling the staleness signals that key on it'
risk_tier: 2
mode: chore
lifecycle_state: draft
created_at: '2026-09-12T22:08:19.367Z'
updated_at: '2026-09-12T22:08:19.367Z'
created_by_session: 'session-c04418cd-a035-44a9-b26e-378d285ccad1'
blast_radius:
  modules:
    - 'packages/caws-cli/src/init/hook-packs/manifest-shared.ts (SHARED_PACK_VERSION)'
    - 'packages/caws-cli/tests/init/pack-fingerprints.json (recorded baseline)'
  data_migration: false
operational_rollback_slo: 5m
scope:
  in:
    - packages/caws-cli/src/init/hook-packs/manifest-shared.ts
    - packages/caws-cli/tests/init/pack-fingerprints.json
  out:
    - packages/caws-cli/dist
invariants:
  - 'Every staleness signal in the guard plane keys on the pack VERSION STAMP, not on file content: the SessionStart pack-drift advisory compares the shipping version to the pinned runtime, and doctor.hooks.installed_pack_version_lag compares the installed header to SHARED_PACK_VERSION. A template change that lands without a version bump therefore moves the enforcement plane while leaving every consumer of the signal believing nothing changed.'
  - 'tests/init/pack-fingerprint.test.js is the supply-chain control for exactly that class (CAWS-TEST-HOOK-INSTALL-FINGERPRINT-001): it recomputes each pack fingerprint from the live template tree and refuses a template change that is not accompanied by BOTH a new recorded fingerprint and a packVersion bump. It was RED on main before this slice.'
  - 'The recorded baseline must be DERIVED from the live tree, never copied from history. Recomputing it certifies the templates as they exist at this commit; it does not license future changes, because the next template change re-trips the same control.'
  - 'This slice certifies only the shared pack on main. A concurrent lane holding an unmerged shared-pack commit (wt-bash-guard-cross-repo) is NOT included, is not modified, and will re-trip this control on its own merge — which is the control working as designed, not a conflict.'
acceptance:
  - id: A1
    given: 'the shared pack template tree at this commit'
    when: 'pack-fingerprint.test.js recomputes the live fingerprint'
    then: 'the shared pack case passes — the recorded baseline version equals SHARED_PACK_VERSION and the recorded fingerprint equals the live one'
  - id: A2
    given: 'the recorded baseline for every other pack (claude-code, codex, dsh, opencode, zcode, kimi-code, qwen-code)'
    when: 'pack-fingerprint.test.js runs'
    then: 'all eight pack cases pass; no other pack baseline is modified by this slice'
  - id: A3
    given: 'SHARED_PACK_VERSION after the bump'
    when: 'an install at the previous version is compared'
    then: 'the previous version is below the shipping version, so doctor.hooks.installed_pack_version_lag and the SessionStart drift advisory now have a signal to report'
observability:
  - 'The bumped version is observable in two places the staleness mechanism already reads: the installed `hook_pack_version` header written into each project copy, and the running CLI''s SHARED_PACK_VERSION surfaced by doctor.hooks.system_runtime / installed_pack_version_lag.'
rollback:
  - 'Revert the commit; SHARED_PACK_VERSION returns to 67 and the recorded baseline to its prior value, and pack-fingerprint.test.js returns to its pre-slice red state. No install is modified by this slice itself — it changes the signal, not any installed file.'
non_functional:
  reliability:
    - 'Two-file change with no runtime code path: a constant and a derived JSON baseline. The control that consumes them is the existing fingerprint test, which fails closed if they disagree.'
contracts: []
