id: DANGER-LATCH-TRAP-KILL-DRYRUN-001
title: 'Escalation dry-run: resolve and verify the kill target without signaling'
risk_tier: 1
mode: feature
lifecycle_state: active
worktree: wt-kill-dryrun
created_at: '2026-09-12T20:57:50.747Z'
updated_at: '2026-09-12T20:58:18.724Z'
created_by_session: 'session-c04418cd-a035-44a9-b26e-378d285ccad1'
blast_radius:
  modules:
    - 'packages/caws-cli/templates/hook-packs/shared/block-dangerous.sh (trap_escalate)'
    - 'packages/caws-cli/tests/hooks/bats/block-dangerous.bats'
  data_migration: false
scope:
  in:
    - packages/caws-cli/templates/hook-packs/shared/block-dangerous.sh
    - packages/caws-cli/tests/hooks/bats/block-dangerous.bats
  out:
    - packages/caws-cli/src
    - packages/caws-cli/dist
invariants:
  - 'CAWS_TRAP_KILL=dryrun runs the escalation path to the signal boundary and stops: threshold, enablement, identity resolution, self/PID-1 refusal, liveness, pid drift, start-time and comm checks all execute exactly as for a real kill, and nothing is signaled.'
  - 'The dry-run verdict is durable evidence: the escalation log records the verified identity (pid, start time, comm) and the sentinel is stamped .trap_dryrun_pid/.trap_dryrun_at, distinct from .trap_escalated_pid (which only a real kill writes).'
  - 'A dry run that would hold a real kill holds and logs the same reason: verification failures are never reported as a verified target, so the dry run cannot overstate the real path.'
  - 'CAWS_TRAP_KILL=1 and 0 keep their existing meanings (kill / disabled-and-logged); dryrun is additive.'
acceptance:
  - id: A1
    given: 'a quarantined session on a surface configured CAWS_TRAP_KILL=dryrun with a verifiable agent process'
    when: 'it makes a denied attempt'
    then: 'the guard blocks, the agent process is still alive afterward, the escalation log records a dry-run verdict naming the verified pid, and the sentinel carries .trap_dryrun_pid but NOT .trap_escalated_pid'
  - id: A2
    given: 'a quarantined session with CAWS_TRAP_KILL=dryrun whose agent identity cannot be resolved or fails verification'
    when: 'it makes a denied attempt'
    then: 'the guard blocks and logs the same held reason a real kill would give; no dry-run stamp is written'
  - id: A3
    given: 'a quarantined session with CAWS_TRAP_KILL=1 and a verifiable agent process'
    when: 'it makes a denied attempt'
    then: 'the process is terminated and .trap_escalated_pid is stamped (the real path is unchanged)'
  - id: A4
    given: 'a quarantined session with CAWS_TRAP_KILL=0'
    when: 'it makes a denied attempt'
    then: 'the guard blocks and logs that kill escalation is disabled; nothing is signaled and no dry-run stamp is written'
observability:
  - 'A dry run records the verified identity (pid, start time, comm) in the threat log and stamps .trap_dryrun_pid/.trap_dryrun_at on the sentinel, so an operator can confirm the target before enabling kill on a surface.'
rollback:
  - 'Revert the implementation commit; CAWS_TRAP_KILL returns to 1/0 only and dryrun falls into the disabled branch (held); rerun the block-dangerous bats suite plus caws doctor.'
non_functional:
  security:
    - 'Dry run never signals: it exercises the same threshold, enablement, resolution, liveness, drift, start-time and comm checks, then stops before the kill with a logged verdict. Failures hold exactly as they do for a real kill, so the dry run cannot report a target the real path would refuse.'
  reliability:
    - 'The dry-run branch adds one comparison before the signal call and one log/stamp on the pass path; the kill branch is byte-identical to the pre-slice behavior, so enabling a real kill after a dry run carries no new risk.'
contracts:
  - name: 'trap-kill-dryrun'
    type: 'contract-test'
    path: 'packages/caws-cli/tests/hooks/bats/block-dangerous.bats'
    description: 'Dry run verifies and stamps without signaling (process survives); unresolved identity holds with the real reason and no stamp; kill=1 still terminates; kill=0 still logs disabled.'
