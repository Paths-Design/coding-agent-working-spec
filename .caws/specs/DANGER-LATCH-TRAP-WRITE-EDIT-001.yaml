blast_radius:
  modules:
    - 'packages/caws-cli/templates/hook-packs/shared/block-dangerous.sh (file-tool trap branch)'
    - 'packages/caws-cli/tests/hooks/bats/block-dangerous.bats'
    - 'doctrine: contract that quarantine covers file mutation (templates/CLAUDE.md, AGENTS.md, CLAUDE.md)'
  data_migration: false
scope:
  in:
    - packages/caws-cli/templates/hook-packs/shared/block-dangerous.sh
    - packages/caws-cli/tests/hooks/bats/block-dangerous.bats
