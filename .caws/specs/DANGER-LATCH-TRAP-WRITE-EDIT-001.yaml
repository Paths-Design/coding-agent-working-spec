invariants:
  - 'While the trap sentinel exists, file-mutating tools (Write, Edit, NotebookEdit, MultiEdit) are denied and recorded as strikes; there is no read-only file-tool carve-out because every file-tool call mutates.'
  - 'Untrapped sessions are untouched: with no sentinel for the resolved session id, the file-tool branch emits nothing, creates nothing, and exits 0 — no behavior change for ordinary Write/Edit traffic.'
  - 'File-tool denial reuses the SAME escalation path as Bash (trap_record_strike + identity-verified trap_escalate); no second escalation mechanism is introduced.'
  - 'The sentinel file itself is guarded independently: protected-paths fails closed on unrecognized extensions under every vendor hooks dir, so a trapped session cannot Write/Edit the sentinel to clear its own trap.'
  - 'No handler-wiring change: block-dangerous.sh is already invoked for every tool and self-filters; the trap simply stops ignoring non-Bash tools.'
acceptance:
  - id: A1
    given: 'a session with an armed trap sentinel'
    when: 'it attempts a Write or an Edit (file_path under any repo path)'
    then: 'the guard emits a block decision naming the quarantine and file mutation, and the sentinel strike count increments per attempt'
  - id: A2
    given: 'a session with NO trap sentinel'
    when: 'it attempts a Write or an Edit'
    then: 'the guard exits 0 with no output and creates no sentinel — ordinary file-tool traffic is unchanged'
  - id: A3
    given: 'a session with an armed trap sentinel on a kill-enabled surface with a verifiable agent process'
    when: 'it attempts a Write or an Edit'
    then: 'the attempt is denied and escalated through the same identity-verified path as a Bash denial (escalation log entry; held-with-audit when identity is unverifiable or the surface ships kill off)'
  - id: A4
    given: 'a session with an armed trap sentinel'
    when: 'the session attempts to Write/Edit the sentinel file itself'
    then: 'protected-paths refuses (fail-closed unknown extension under the hooks dir) — the self-clear path stays closed'
observability:
  - 'Every blocked file-tool attempt records a trap strike with the tool name and path in the sentinel, and escalation decisions land in the danger-latch escalation log unchanged from TRAP-001.'
rollback:
  - 'Revert the implementation commit; file tools return to the pre-slice behavior (not consulted while trapped); rerun the block-dangerous bats suite plus caws doctor.'
non_functional:
  security:
    - 'File-tool denial reuses the same identity-verified escalation path as Bash; untrapped sessions are untouched (no output, no mkdir, exit 0); the sentinel file itself remains protected by protected-paths fail-closed.'
  reliability:
    - 'The file-tool branch fails open to normal operation when session resolution or sentinel lookup is unavailable (no sentinel = no output), and fails closed to denial whenever a sentinel exists for the resolved session id.'
contracts:
  - name: 'trap-file-tool-admission'
    type: 'contract-test'
    path: 'packages/caws-cli/tests/hooks/bats/block-dangerous.bats'
    description: 'Trapped sessions: Write and Edit are denied with strikes and escalated through the shared path; untrapped sessions see no change; the sentinel self-clear stays blocked by protected-paths.'
