invariants:
  - 'The machine runtime makes a project''s copied hook pack inert ONLY for surfaces CAWS has registered in that harness''s native config. system-runtime.ts vendorFor admits exactly codex, claude-code and qwen-code; every other harness — including the adapter-wired DSH bridge, which runs <repoRoot>/.caws/hooks/dispatch/<event>.sh directly — executes the repo''s own copy and has no runtime path at all.'
  - 'Registering the machine runtime for a harness with no verified adapter would be a silent governance downgrade: systemSurfaceEnabled() would report true, caws init would plan NO local hook pack (init.ts:886-887), and the harness would keep executing whichever copy it already had — or, in a fresh repo, no guards at all. vendorFor refuses this, and the refusal is therefore a safety boundary, not an error path.'
  - 'That boundary is untested. This slice adds the missing regression lock rather than a behavior change: the refusal and its explanatory message already exist and are correct.'
  - 'doctor.hooks.installed_pack_version_lag must not be re-suppressed on systemRuntime presence. The runtime snapshot reports CONFIGURED surfaces; it cannot prove the harness executing against this repo is among them. Reporting the lag is the fail-safe direction: a false-positive advisory, never silence about a live old guard plane.'
acceptance:
  - id: A1
    given: 'a surface outside the supported registration set (dsh)'
    when: 'configureSystemRuntime is called for it'
    then: 'it throws with a message naming the supported set, and writes no file'
  - id: A2
    given: 'the regression lock from A1'
    when: 'the supported-surface guard in vendorFor is widened (a mutation)'
    then: 'the lock fails — it is falsifiable, not a test that passes on any implementation'
  - id: A3
    given: 'the supported surfaces (codex, claude-code, qwen-code)'
    when: 'the same test file runs'
    then: 'registration still succeeds for them — the lock does not over-refuse'
  - id: A4
    given: 'the doc comment on doctor.hooks.installed_pack_version_lag'
    when: 'a reader asks why a copied pack stays live under an installed runtime'
    then: 'it names the per-harness registration boundary as the reason, instead of asserting a per-surface execution plane as if it were the design'
observability:
  - 'The refusal is reachable from the CLI (`caws init adapters configure --agent-surface dsh --plan` prints the message and exits 1), so the boundary is observable without reading source.'
rollback:
  - 'Revert the commit; the test lock and the corrected comment are removed and behavior is unchanged, since no production path was modified.'
non_functional:
  security:
    - 'The locked invariant is the one that keeps a governance downgrade from being silent: an unsupported surface must be refused BEFORE any machine settings are written, so a partially configured surface cannot make init stop maintaining the pack the harness actually executes.'
contracts: []
